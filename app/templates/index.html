<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#081221" media="(prefers-color-scheme: dark)">
  <title>RG Manutenção — Hospital Rio Grande</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="preload" href="{{ url_for('static', filename='fonts/manrope.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', filename='fonts/unbounded.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    // aplica o tema salvo antes da renderização (evita piscar)
    try { const t = localStorage.getItem("rg-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body data-demo="{{ '1' if demo else '0' }}">
  <div id="root"><div class="loading"><div class="spinner"></div>Carregando…</div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
