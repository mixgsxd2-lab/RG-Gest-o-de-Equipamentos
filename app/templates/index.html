<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2545">
  <title>RG Manutenção — Hospital Rio Grande</title>
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    // aplica o tema salvo antes da renderização (evita piscar)
    try { const t = localStorage.getItem("rg-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  {% if demo %}
  <div class="demo-banner" role="note">
    <strong>DEMONSTRAÇÃO</strong> · Ambiente com dados 100% fictícios — não utilize informações reais de pacientes
  </div>
  {% endif %}
  <div id="root"><div class="loading"><div class="spinner"></div>Carregando…</div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
