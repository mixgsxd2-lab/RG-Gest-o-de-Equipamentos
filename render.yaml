services:
  - type: web
    name: rg-gestao-equipamentos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: IOT_API_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "1"
